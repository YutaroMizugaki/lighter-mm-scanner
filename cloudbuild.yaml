# Cloud Build pipeline: test → build → Artifact Registry → Cloud Run Worker Pool
# Official Worker Pool deploy:
#   https://docs.cloud.google.com/run/docs/deploy-worker-pools
#   gcloud run worker-pools deploy
#
# Substitutions (set on trigger / CLI):
#   _REGION, _AR_REPO, _WORKER_POOL, _GCS_BUCKET, _GCS_PUBLIC_BUCKET, _SERVICE_ACCOUNT
#
# API enable is NOT part of this pipeline — run scripts/bootstrap_gcp.sh once as admin.

substitutions:
  _REGION: asia-northeast1
  _AR_REPO: lighter-mm
  _WORKER_POOL: lighter-mm-collector
  _GCS_BUCKET: ""
  _GCS_PUBLIC_BUCKET: ""
  _SERVICE_ACCOUNT: ""
  _CPU: "1"
  _MEMORY: 1Gi
  _INSTANCES: "1"
  _RUN_TARGET_HOURS: "72"
  _ANALYZER_JOB: lighter-mm-analyzer
  _ANALYZER_CPU: "2"
  _ANALYZER_MEMORY: 2Gi
  _ANALYZER_SCHEDULE: "*/15 * * * *"
  _ANALYZER_MOUNT_PATH: /mnt/lighter-mm
  _SCHEDULER_SERVICE_ACCOUNT: ""

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true

steps:
  # STEP 1 — install
  # Distroless uv:0.12.3 has no Python; use the Python 3.12 image for sync/test.
  - name: ghcr.io/astral-sh/uv:0.12.3-python3.12-trixie-slim
    id: install
    entrypoint: uv
    args: ["sync", "--frozen", "--all-extras"]

  # STEP 2 — ruff (parallel with pytest after install)
  - name: ghcr.io/astral-sh/uv:0.12.3-python3.12-trixie-slim
    id: ruff
    entrypoint: uv
    args: ["run", "ruff", "check", "src", "tests"]
    waitFor: ["install"]

  # STEP 3 — pytest (must pass before build/deploy)
  - name: ghcr.io/astral-sh/uv:0.12.3-python3.12-trixie-slim
    id: pytest
    entrypoint: uv
    args: ["run", "pytest", "-q"]
    waitFor: ["install"]

  # STEP 4 — Docker build with GIT_SHA (only after ruff + pytest pass)
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --build-arg
      - GIT_SHA=$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:latest
      - .
    waitFor: ["ruff", "pytest"]

  # STEP 5 — push Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector
    waitFor: ["build"]

  # STEP 6 — preflight (no API enable; fail fast with actionable message)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: preflight
    entrypoint: bash
    args:
      - scripts/cloudbuild_preflight.sh
    env:
      - PROJECT_ID=$PROJECT_ID
      - _REGION=${_REGION}
      - _AR_REPO=${_AR_REPO}
      - _GCS_BUCKET=${_GCS_BUCKET}
      - _GCS_PUBLIC_BUCKET=${_GCS_PUBLIC_BUCKET}
      - _SERVICE_ACCOUNT=${_SERVICE_ACCOUNT}
      - _SCHEDULER_SERVICE_ACCOUNT=${_SCHEDULER_SERVICE_ACCOUNT}
      - _WORKER_POOL=${_WORKER_POOL}
      - _ANALYZER_JOB=${_ANALYZER_JOB}
    waitFor: ["push"]

  # STEP 7 — deploy Cloud Run Worker Pool (manual scaling = 1)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Note: bash vars must use $$ so Cloud Build does not treat them as substitutions.
        SA_FLAGS=()
        if [[ -n "${_SERVICE_ACCOUNT}" ]]; then
          SA_FLAGS+=(--service-account="${_SERVICE_ACCOUNT}")
        fi
        gcloud run worker-pools deploy "${_WORKER_POOL}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:$COMMIT_SHA" \
          --cpu="${_CPU}" \
          --memory="${_MEMORY}" \
          --instances="${_INSTANCES}" \
          --set-env-vars="ENVIRONMENT=cloud,STRUCTURED_LOGGING=true,LIGHTER_MM_NO_DASHBOARD=1,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GCS_BUCKET=${_GCS_BUCKET},GCS_PUBLIC_BUCKET=${_GCS_PUBLIC_BUCKET},RUN_TARGET_HOURS=${_RUN_TARGET_HOURS},GIT_SHA=$COMMIT_SHA,BOOK_SAMPLE_INTERVAL_SECONDS=5,PARQUET_ROTATION_MINUTES=15,GCS_UPLOAD_INTERVAL_MINUTES=5,MAX_SUBSCRIPTIONS_PER_CONNECTION=95" \
          "$${SA_FLAGS[@]}"
    waitFor: ["preflight"]

  # STEP 8 — deploy Cloud Run Analyzer Job (same image, GCS mount read-only)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-analyzer
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SA_FLAGS=()
        if [[ -n "${_SERVICE_ACCOUNT}" ]]; then
          SA_FLAGS+=(--service-account="${_SERVICE_ACCOUNT}")
        fi
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:$COMMIT_SHA"
        gcloud run jobs deploy "${_ANALYZER_JOB}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="$$IMAGE" \
          --cpu="${_ANALYZER_CPU}" \
          --memory="${_ANALYZER_MEMORY}" \
          --tasks=1 \
          --max-retries=0 \
          --set-env-vars="ENVIRONMENT=cloud,STRUCTURED_LOGGING=true,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GCS_BUCKET=${_GCS_BUCKET},GCS_PUBLIC_BUCKET=${_GCS_PUBLIC_BUCKET},GIT_SHA=$COMMIT_SHA,DUCKDB_MEMORY_LIMIT=1GiB,DUCKDB_THREADS=2,ANALYZER_MOUNT_PATH=${_ANALYZER_MOUNT_PATH}" \
          --command="lighter-mm" \
          --args="cloud-analyze" \
          --add-volume=name=gcs-data,type=cloud-storage,bucket=${_GCS_BUCKET},readonly=true \
          --add-volume-mount=volume=gcs-data,mount-path=${_ANALYZER_MOUNT_PATH} \
          "$${SA_FLAGS[@]}"
    waitFor: ["preflight"]

  # STEP 9 — grant Scheduler SA permission to invoke Analyzer Job
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: grant-scheduler-invoker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SCHEDULER_SA="${_SCHEDULER_SERVICE_ACCOUNT}"
        if [[ -z "$$SCHEDULER_SA" ]]; then
          SCHEDULER_SA="${_SERVICE_ACCOUNT}"
        fi
        if [[ -z "$$SCHEDULER_SA" ]]; then
          echo "ERROR: _SCHEDULER_SERVICE_ACCOUNT or _SERVICE_ACCOUNT required for Scheduler" >&2
          exit 1
        fi
        gcloud run jobs add-iam-policy-binding "${_ANALYZER_JOB}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --member="serviceAccount:$$SCHEDULER_SA" \
          --role="roles/run.invoker"
    waitFor: ["deploy-analyzer"]

  # STEP 10 — Cloud Scheduler for periodic analyzer runs (Cloud Run Jobs v2 API)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-analyzer-scheduler
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        JOB_URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/${_REGION}/jobs/${_ANALYZER_JOB}:run"
        SCHEDULER_SA="${_SCHEDULER_SERVICE_ACCOUNT}"
        if [[ -z "$$SCHEDULER_SA" ]]; then
          SCHEDULER_SA="${_SERVICE_ACCOUNT}"
        fi
        if [[ -z "$$SCHEDULER_SA" ]]; then
          echo "ERROR: _SCHEDULER_SERVICE_ACCOUNT or _SERVICE_ACCOUNT required for Cloud Scheduler OAuth" >&2
          exit 1
        fi
        if gcloud scheduler jobs describe "lighter-mm-analyzer-schedule" \
            --project="$PROJECT_ID" --location="${_REGION}" >/dev/null 2>&1; then
          gcloud scheduler jobs update http "lighter-mm-analyzer-schedule" \
            --project="$PROJECT_ID" \
            --location="${_REGION}" \
            --schedule="${_ANALYZER_SCHEDULE}" \
            --uri="$$JOB_URI" \
            --http-method=POST \
            --oauth-service-account-email="$$SCHEDULER_SA" \
            --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
        else
          gcloud scheduler jobs create http "lighter-mm-analyzer-schedule" \
            --project="$PROJECT_ID" \
            --location="${_REGION}" \
            --schedule="${_ANALYZER_SCHEDULE}" \
            --uri="$$JOB_URI" \
            --http-method=POST \
            --oauth-service-account-email="$$SCHEDULER_SA" \
            --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
        fi
    waitFor: ["grant-scheduler-invoker"]

  # STEP 11 — fast post-deploy smoke (revision + public status JSON)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: post-deploy-smoke
    entrypoint: bash
    args:
      - scripts/cloudbuild_post_deploy_smoke.sh
    env:
      - PROJECT_ID=$PROJECT_ID
      - COMMIT_SHA=$COMMIT_SHA
      - _REGION=${_REGION}
      - _AR_REPO=${_AR_REPO}
      - _GCS_PUBLIC_BUCKET=${_GCS_PUBLIC_BUCKET}
      - _WORKER_POOL=${_WORKER_POOL}
      - _ANALYZER_JOB=${_ANALYZER_JOB}
    waitFor: ["deploy-analyzer-scheduler"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/collector:latest

timeout: 1800s
